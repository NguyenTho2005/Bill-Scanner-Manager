name: bill_tracker
description: "Visual Expense Tracker & Smart Receipt Scanner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Local Database ────────────────────────────────────────────────────────
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.29

  # ── Security ──────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # ── Camera & Image ────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Crypto / Hashing ──────────────────────────────────────────────────────
  crypto: ^3.0.6

  # ── ML Kit (On-device AI) ─────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_image_labeling: ^0.14.2

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── UI & Charts ───────────────────────────────────────────────────────────
  fl_chart: ^0.70.2
  gap: ^3.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.15
  drift_dev: ^2.28.0

  # ── Testing ───────────────────────────────────────────────────────────────
  local_auth_platform_interface: ^1.1.0

  # ── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^5.0.0
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/categories/
    - assets/images/

